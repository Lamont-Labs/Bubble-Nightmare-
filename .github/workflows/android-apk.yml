name: Build Bubble Nightmare APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "artifacts/bubble-nightmare/**"
      - ".github/workflows/android-apk.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        run: pnpm --filter @workspace/bubble-nightmare exec expo prebuild --platform android --no-install --clean

      - name: Build standalone APK
        working-directory: artifacts/bubble-nightmare/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK for phone download
        uses: actions/upload-artifact@v4
        with:
          name: bubble-nightmare-android-apk
          path: artifacts/bubble-nightmare/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
